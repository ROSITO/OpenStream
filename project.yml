name: OpenStream
options:
  bundleIdPrefix: app.openstream
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_TESTABILITY: YES
targets:
  OpenStream:
    type: application
    platform: macOS
    sources:
      - path: OpenStream
        excludes:
          - Resources/AppIcon.iconset/**
          - Resources/AppIcon.icns
          - Resources/AppIcon-1024.png
          - Resources/Helpers/**
      - path: OpenStreamCore/EpisodeEnumerator.swift
      - path: OpenStreamCore/SeasonResolver.swift
      - path: OpenStreamCore/PopupGuard.swift
      - path: OpenStreamCore/FlixModels.swift
      - path: OpenStreamCore/FlixRSS.swift
      - path: OpenStreamCore/FlixStore.swift
      - path: OpenStreamCore/FlixService.swift
      - path: OpenStream/Resources/Helpers
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openstream.OpenStream
        PRODUCT_NAME: OpenStream
        MARKETING_VERSION: "0.1.17"
        CURRENT_PROJECT_VERSION: "18"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenStream
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: OpenStream/Resources/OpenStream.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
        ENABLE_PREVIEWS: YES
    entitlements:
      path: OpenStream/Resources/OpenStream.entitlements
    scheme:
      testTargets:
        - OpenStreamTests
  OpenStreamCLI:
    type: tool
    platform: macOS
    sources:
      - path: OpenStreamCLI
        excludes:
          - README.md
      - path: OpenStreamCore
      # Pipeline headless partagé (même sources que l’app, module CLI).
      - path: OpenStream/Core/Logging
      - path: OpenStream/Core/Models
      - path: OpenStream/Core/Export
      - path: OpenStream/Core/Preferences/SettingsCore.swift
      - path: OpenStream/Download
        excludes:
          - DownloadManager.swift
      - path: OpenStream/FFmpeg
      - path: OpenStream/Media
      - path: OpenStream/Network
      - path: OpenStream/Plugins
      - path: OpenStream/Session/CookieBridge.swift
      - path: OpenStream/Browser/WeakScriptMessageHandler.swift
      - path: OpenStream/Browser/PageTitleResolver.swift
    copyFiles:
      - path: OpenStream/Resources/Helpers/ffmpeg
        destination: executables
        optional: true
      - path: OpenStream/Resources/Helpers/ffprobe
        destination: executables
        optional: true
    postCompileScripts:
      - name: Ensure CLI FFmpeg Helpers
        basedOnDependencyAnalysis: false
        script: |
          set -e
          DEST="${BUILT_PRODUCTS_DIR}"
          HELPERS_SRC="${SRCROOT}/OpenStream/Resources/Helpers"
          if [[ -x "${HELPERS_SRC}/ffmpeg" ]]; then
            mkdir -p "${DEST}/Helpers"
            cp -f "${HELPERS_SRC}/ffmpeg" "${DEST}/Helpers/ffmpeg"
            cp -f "${HELPERS_SRC}/ffprobe" "${DEST}/Helpers/ffprobe"
            chmod +x "${DEST}/Helpers/ffmpeg" "${DEST}/Helpers/ffprobe"
            # Aussi à plat à côté du binaire (fallback résolution).
            cp -f "${HELPERS_SRC}/ffmpeg" "${DEST}/ffmpeg"
            cp -f "${HELPERS_SRC}/ffprobe" "${DEST}/ffprobe"
            chmod +x "${DEST}/ffmpeg" "${DEST}/ffprobe"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openstream.OpenStreamCLI
        PRODUCT_NAME: openstream-cli
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path"
    scheme: {}
  OpenStreamTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OpenStreamTests
        excludes:
          - Fixtures
      - path: Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: OpenStream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openstream.OpenStreamTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenStream.app/Contents/MacOS/OpenStream"
        BUNDLE_LOADER: "$(TEST_HOST)"
