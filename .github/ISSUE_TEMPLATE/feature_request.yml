name: Feature request
description: Suggest an improvement within the non-DRM scope
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Features that require DRM circumvention, stream decryption, or auth bypass are **out of scope**.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user/agent pain does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - macOS app
        - openstream-cli / agents
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
